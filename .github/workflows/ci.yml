# Same checks the Obsidian community review runs (eslint-plugin-obsidianmd), plus tests and the build.
name: ci

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
