# Builds the cursor helper (helper/) for every desktop OS.
# PRs touching helper/ just build it; pushing a tag helper-v* also attaches the binaries to that release,
# which is where the plugin's "Download helper" button fetches them from.
name: helper

on:
  pull_request:
    paths: ["helper/**", ".github/workflows/helper.yml"]
  push:
    tags: ["helper-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: cap-sort-helper-darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, asset: cap-sort-helper-darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: cap-sort-helper-win32-x64.exe }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, asset: cap-sort-helper-linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps (PipeWire + clang for bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev pkg-config
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the binary like the plugin expects
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/cap-sort-helper
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p ../dist && cp "$src" "../dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/helper-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
