[package]
name = "cap-sort-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
scap = "0.1.0-beta.1"
serde_json = "1.0.154"

# scap 0.1.0-beta.1 can't size other apps' windows on macOS; see vendor/scap/src/targets/mac/mod.rs ("cap-sort patch").
